<!doctype html>
<meta charset="utf-8">
<title>OpenSWMM module probe</title>
<pre id="status">script pending</pre>
<script src="openswmm2d.js"></script>
<script>
(async () => {
    const status = document.getElementById('status');
    status.textContent = `factory: ${typeof createOpenSwmm2D}`;
    try {
        const module = await createOpenSwmm2D({
            locateFile: file => file.endsWith('.wasm') ? 'openswmm2d.wasm' : file
        });
        status.textContent += `\nmodule ready: ${typeof module.cwrap}`;
        document.title = 'PASS OpenSWMM module probe';
    } catch (error) {
        status.textContent += `\n${error.stack || error}`;
        document.title = 'FAIL OpenSWMM module probe';
    }
})();
</script>
