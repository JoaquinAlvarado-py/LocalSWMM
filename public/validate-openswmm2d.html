<!doctype html>
<meta charset="utf-8">
<title>OpenSWMM 2D worker validation</title>
<pre id="status">Starting OpenSWMM 2D worker validation...</pre>
<script>
(async () => {
    const status = document.getElementById('status');
    const lines = [];
    const write = text => {
        lines.push(String(text));
        status.textContent = lines.join('\n');
    };

    try {
        const inpResponse = await fetch('sample_models/2d_complete_example.inp');
        if (!inpResponse.ok) throw new Error(`Could not load eight-cell model: HTTP ${inpResponse.status}`);
        const inp = await inpResponse.text();
        const wasmBinary = await fetch('openswmm2d.wasm').then(response => response.arrayBuffer());
        const worker = new Worker('openSwmm2dWorker.js?v=19');
        const result = await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                worker.terminate();
                reject(new Error('Worker validation timed out after 120 seconds.'));
            }, 120000);
            worker.onmessage = event => {
                const message = event.data || {};
                if (message.type === 'stdout' || message.type === 'stderr') write(`${message.type}: ${message.text}`);
                if (message.type === 'status2d') write(`status: ${message.stage}`);
                if (message.type === 'progress2d') write(`progress: ${message.elapsedMs} ms`);
                if (message.type === 'results2d') {
                    clearTimeout(timeout);
                    worker.terminate();
                    resolve(message);
                }
                if (message.type === 'error') {
                    clearTimeout(timeout);
                    worker.terminate();
                    reject(new Error(message.message));
                }
            };
            worker.onerror = event => {
                clearTimeout(timeout);
                worker.terminate();
                reject(new Error(event.message || 'Worker script failed.'));
            };
            worker.postMessage({
                type: 'run2d',
                inp,
                triangleIds: Array.from({ length: 8 }, (_, index) => `T${index}`),
                frameIntervalMs: 300000,
                wasmBinary
            }, [wasmBinary]);
        });

        const finalFrame = result.frames[result.frames.length - 1];
        const summary = {
            ok: result.triangleIds.length === 8 && finalFrame.depth.length === 8,
            triangles: result.triangleIds.length,
            frames: result.frames.length,
            finalElapsedMs: finalFrame.elapsedMs,
            finalDepth: finalFrame.depth,
            finalHead: finalFrame.head,
            maxVelocity: finalFrame.velocity,
            diagnostics: result.diagnostics,
            reportLength: result.report.length
        };
        window.validationResult = summary;
        document.title = summary.ok ? 'PASS OpenSWMM 2D worker validation' : 'FAIL OpenSWMM 2D worker validation';
        write(JSON.stringify(summary, null, 2));
    } catch (error) {
        window.validationError = error && error.stack ? error.stack : String(error);
        document.title = 'FAIL OpenSWMM 2D worker validation';
        write(window.validationError);
    }
})();
</script>
