<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anderson acceleration in the Picard loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,.08); --rule: rgba(45,49,66,.12);
      --label-rule: rgba(45,49,66,.20); --lane: rgba(45,49,66,.018); --node: #fff;
      --node-stroke: rgba(45,49,66,.25); --chip: rgba(45,49,66,.12); --dot: rgba(45,49,66,.10);
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font: 500 .66rem var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif); letter-spacing: -.02em; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    svg text { font-family: var(--sans); }
    .mono { font-family: var(--mono); }
    .lane { fill: var(--lane); }
    .rule { stroke: var(--rule); }
    .label-rule { stroke: var(--label-rule); }
    .actor { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: .08em; }
    .step-label { fill: var(--muted); font: 500 6px var(--mono); letter-spacing: .12em; }
    .step-chip { fill: var(--chip); }
    .step-num { fill: var(--ink); font: 600 7px var(--mono); }
    .connector { fill: none; stroke: var(--muted); stroke-width: 1; }
    .connector.focal { stroke: var(--accent); stroke-width: 1.2; }
    .connector.trigger { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4,3; }
    .node-mask { fill: var(--paper); }
    .node { fill: var(--node); stroke: var(--node-stroke); }
    .node.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .role { fill: rgba(45,49,66,.10); }
    .role.focal { fill: rgba(235,108,54,.25); }
    .role-text { fill: var(--ink); font: 600 6px var(--mono); }
    .role-text.focal { fill: var(--accent); }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); }
    .node-sub { fill: var(--muted); font: 6.5px var(--mono); }
    .node-tool { fill: var(--soft); font: 6.5px var(--mono); }
    .arrow-label { fill: var(--muted); font: 6.5px var(--mono); letter-spacing: .08em; }
    .callout { fill: var(--ink); font: italic 14px var(--serif); }
    .legend-key { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: .12em; }
    .legend-text { fill: var(--muted); font: 8px var(--sans); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Diagram Design</p>
    <h1>Anderson acceleration: mixing two iterates</h1>

    <svg viewBox="0 0 1200 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="anderson-accel-title anderson-accel-desc">
      <title id="anderson-accel-title">Anderson acceleration in the Picard loop</title>
      <desc id="anderson-accel-desc">Process of Anderson acceleration inside the Picard iteration: per-node residual, safety gates, mixing coefficient, blend, state commit, and the dual convergence test, with the retry loop back to the solver.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="var(--muted)"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="var(--paper)"/><rect width="100%" height="100%" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="812" height="80"/>
      <g class="rule" stroke-width=".8"><line x1="0" y1="36" x2="1200" y2="36"/><line x1="0" y1="116" x2="1200" y2="116"/><line x1="0" y1="196" x2="1200" y2="196"/></g>
      <line class="label-rule" x1="140" y1="36" x2="140" y2="196"/>
      <g class="actor" text-anchor="middle"><text x="70" y="80">PICARD</text><text x="70" y="160">ANDERSON</text></g>
      <g text-anchor="middle">
        <rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text class="step-label" x="198" y="32">SOLVE</text>
        <rect class="step-chip" x="302" y="8" width="16" height="16" rx="8"/><text class="step-num" x="310" y="19">2</text><text class="step-label" x="310" y="32">RESIDUAL</text>
        <rect class="step-chip" x="414" y="8" width="16" height="16" rx="8"/><text class="step-num" x="422" y="19">3</text><text class="step-label" x="422" y="32">GATES</text>
        <rect class="step-chip" x="526" y="8" width="16" height="16" rx="8"/><text class="step-num" x="534" y="19">4</text><text class="step-label" x="534" y="32">COEFF</text>
        <rect class="step-chip" x="638" y="8" width="16" height="16" rx="8"/><text class="step-num" x="646" y="19">5</text><text class="step-label" x="646" y="32">BLEND</text>
        <rect x="750" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="758" y="19" fill="var(--accent)" font-size="7" font-weight="600" class="mono">6</text><text x="758" y="32" fill="var(--accent)" font-size="6" font-weight="500" letter-spacing=".12em" class="mono">CONVERGE?</text>
        <rect class="step-chip" x="862" y="8" width="16" height="16" rx="8"/><text class="step-num" x="870" y="19">7</text><text class="step-label" x="870" y="32">NEXT</text>
      </g>
      <!-- Connectors: right exit, r=8 orthogonal bend, top/bottom entry. -->
      <path class="connector" d="M248 76 H302 Q310 76 310 84 V124" marker-end="url(#arrow)"/>
      <line class="connector" x1="360" y1="156" x2="372" y2="156" marker-end="url(#arrow)"/>
      <line class="connector" x1="472" y1="156" x2="484" y2="156" marker-end="url(#arrow)"/>
      <line class="connector" x1="584" y1="156" x2="596" y2="156" marker-end="url(#arrow)"/>
      <path class="connector focal" d="M696 156 H750 Q758 156 758 148 V108" marker-end="url(#arrow-accent)"/>
      <line class="connector focal" x1="808" y1="76" x2="820" y2="76" marker-end="url(#arrow-accent)"/>
      <path class="connector trigger" d="M808 92 H820 V216 H206 Q198 216 198 208 V108" marker-end="url(#arrow-sm)"/>
      <rect x="700" y="196" width="44" height="12" rx="2" fill="var(--paper)"/>
      <text class="arrow-label" x="722" y="207" text-anchor="middle">RETRY ≤8</text>
      <!-- Nodes -->
      <g text-anchor="middle">
        <g><rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/><rect class="node" x="148" y="44" width="100" height="64" rx="6"/><rect class="role" x="152" y="48" width="20" height="10" rx="2"/><text class="role-text" x="162" y="56">PIC</text><text class="node-title" x="198" y="70">Picard solve</text><text class="node-sub" x="198" y="84">y_last → g_k</text><text class="node-tool" x="198" y="96">momentum + continuity</text></g>
        <g><rect class="node-mask" x="260" y="124" width="100" height="64" rx="6"/><rect class="node" x="260" y="124" width="100" height="64" rx="6"/><rect class="role" x="264" y="128" width="20" height="10" rx="2"/><text class="role-text" x="274" y="136">AND</text><text class="node-title" x="310" y="150">Residual</text><text class="node-sub" x="310" y="164">r_k = g_k − y_last</text><text class="node-tool" x="310" y="176">recall r_k−1 · g_prev</text></g>
        <g><rect class="node-mask" x="372" y="124" width="100" height="64" rx="6"/><rect class="node" x="372" y="124" width="100" height="64" rx="6"/><rect class="role" x="376" y="128" width="20" height="10" rx="2"/><text class="role-text" x="386" y="136">AND</text><text class="node-title" x="422" y="150">Gates</text><text class="node-sub" x="422" y="164">|r_k| ≤ 20·tol</text><text class="node-tool" x="422" y="176">step ≥ 1 · no skip flag</text></g>
        <g><rect class="node-mask" x="484" y="124" width="100" height="64" rx="6"/><rect class="node" x="484" y="124" width="100" height="64" rx="6"/><rect class="role" x="488" y="128" width="20" height="10" rx="2"/><text class="role-text" x="498" y="136">AND</text><text class="node-title" x="534" y="150">Coefficient</text><text class="node-sub" x="534" y="164">α = r_k·dr / dr²</text><text class="node-tool" x="534" y="176">clamped to [0, 1]</text></g>
        <g><rect class="node-mask" x="596" y="124" width="100" height="64" rx="6"/><rect class="node" x="596" y="124" width="100" height="64" rx="6"/><rect class="role" x="600" y="128" width="20" height="10" rx="2"/><text class="role-text" x="610" y="136">AND</text><text class="node-title" x="646" y="150">Blend</text><text class="node-sub" x="646" y="164">y = (1−α)g_k + α·g_prev</text><text class="node-tool" x="646" y="176">y ≥ 0 · recompute dV</text></g>
        <g><rect class="node-mask" x="708" y="44" width="100" height="64" rx="6"/><rect class="node focal" x="708" y="44" width="100" height="64" rx="6"/><rect class="role focal" x="712" y="48" width="20" height="10" rx="2"/><text class="role-text focal" x="722" y="56">PIC</text><text class="node-title" x="758" y="70">Converged?</text><text class="node-sub" x="758" y="84">|g_k − y_last| ≤ tol</text><text class="node-tool" x="758" y="96">and |y − y_last| ≤ tol</text></g>
        <g><rect class="node-mask" x="820" y="44" width="100" height="64" rx="6"/><rect class="node" x="820" y="44" width="100" height="64" rx="6"/><rect class="role" x="824" y="48" width="20" height="10" rx="2"/><text class="role-text" x="834" y="56">PIC</text><text class="node-title" x="870" y="70">Next timestep</text><text class="node-sub" x="870" y="84">exit Picard loop</text><text class="node-tool" x="870" y="96">report · snapshot</text></g>
      </g>
      <!-- Editorial callout: when AA is skipped -->
      <text class="callout" x="752" y="170">AA is skipped at every branch kink:</text>
      <text class="callout" x="752" y="190">surcharge, pond, slot, weir, orifice, pump</text>
      <path d="M 820 200 Q 620 208 430 192" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="422" cy="188" r="2" fill="#2d3142"/>
      <!-- Legend -->
      <line x1="30" y1="236" x2="1170" y2="236" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text class="legend-key" x="144" y="252">STEPS</text>
      <g text-anchor="middle">
        <rect class="step-chip" x="200" y="244" width="16" height="16" rx="8"/><text class="step-num" x="208" y="255">1</text><text class="legend-text" x="240" y="255">SOLVE</text>
        <rect class="step-chip" x="292" y="244" width="16" height="16" rx="8"/><text class="step-num" x="300" y="255">2</text><text class="legend-text" x="332" y="255">RESIDUAL</text>
        <rect class="step-chip" x="384" y="244" width="16" height="16" rx="8"/><text class="step-num" x="392" y="255">3</text><text class="legend-text" x="424" y="255">GATES</text>
        <rect class="step-chip" x="476" y="244" width="16" height="16" rx="8"/><text class="step-num" x="484" y="255">4</text><text class="legend-text" x="516" y="255">COEFF</text>
        <rect class="step-chip" x="568" y="244" width="16" height="16" rx="8"/><text class="step-num" x="576" y="255">5</text><text class="legend-text" x="608" y="255">BLEND</text>
        <rect x="660" y="244" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="668" y="255" fill="var(--accent)" font-size="7" font-weight="600" class="mono">6</text><text x="700" y="255" fill="var(--accent)" font-size="8">CONVERGE?</text>
        <rect class="step-chip" x="752" y="244" width="16" height="16" rx="8"/><text class="step-num" x="760" y="255">7</text><text class="legend-text" x="792" y="255">NEXT</text>
      </g>
      <text class="legend-key" x="144" y="276">FLOW</text>
      <line x1="200" y1="272" x2="228" y2="272" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="240" y="276">Critical handoff</text>
      <line x1="420" y1="272" x2="448" y2="272" stroke="var(--muted)" marker-end="url(#arrow)"/><text class="legend-text" x="460" y="276">Sequential handoff</text>
      <line x1="660" y1="272" x2="688" y2="272" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/><text class="legend-text" x="700" y="276">Retry loop</text>
    </svg>
  </div>
</body>
</html>
