<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1D engine calculation process · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;
      --accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--rule:rgba(45,49,66,.12);
      --label-rule:rgba(45,49,66,.20);--lane:rgba(45,49,66,.018);--node:#fff;
      --node-stroke:rgba(45,49,66,.25);--chip:rgba(45,49,66,.12);--dot:rgba(45,49,66,.10);
      --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;
      --mono:'Geist Mono',ui-monospace,monospace;
    }
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1120px;width:100%}
    .eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}
    svg{width:100%;min-width:1000px;display:block}
    svg text{font-family:var(--sans)}
    .mono{font-family:var(--mono)}
    .lane{fill:var(--lane)}
    .rule{stroke:var(--rule)}
    .label-rule{stroke:var(--label-rule)}
    .actor{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.08em}
    .step-label{fill:var(--muted);font:500 6px var(--mono);letter-spacing:.12em}
    .step-chip{fill:var(--chip)}
    .step-num{fill:var(--ink);font:600 7px var(--mono)}
    .connector{fill:none;stroke:var(--muted);stroke-width:1}
    .connector.focal{stroke:var(--accent);stroke-width:1.2}
    .connector.trigger{stroke:var(--muted);stroke-width:1;stroke-dasharray:4,3}
    .node-mask{fill:var(--paper)}
    .node{fill:var(--node);stroke:var(--node-stroke)}
    .node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
    .role{fill:rgba(45,49,66,.10)}
    .role.focal{fill:rgba(235,108,54,.25)}
    .role-text{fill:var(--ink);font:600 6px var(--mono)}
    .role-text.focal{fill:var(--accent)}
    .node-title{fill:var(--ink);font:600 9px var(--sans)}
    .node-sub{fill:var(--muted);font:6.5px var(--mono)}
    .node-tool{fill:var(--soft);font:6.5px var(--mono)}
    .arrow-label{fill:var(--muted);font:6.5px var(--mono);letter-spacing:.08em}
    .legend-key{fill:var(--muted);font:500 7px var(--mono);letter-spacing:.12em}
    .legend-text{fill:var(--muted);font:8px var(--sans)}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Diagram Design</p>
    <h1>How the 1D engine computes one timestep</h1>
    <svg viewBox="0 0 1064 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engine-1d-title engine-1d-desc">
      <title id="engine-1d-title">1D engine calculation process</title>
      <desc id="engine-1d-desc">Process diagram of the 1D dynamic-wave engine: runoff hydrology feeds lateral inflows, then a Picard iteration alternates link momentum and node continuity until heads converge, before output snapshots are written.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="var(--muted)"/></marker>
      </defs>
      <rect width="1064" height="460" fill="var(--paper)"/><rect width="1064" height="460" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="924" height="80"/><rect class="lane" x="140" y="196" width="924" height="80"/>
      <g class="rule" stroke-width=".8"><line x1="0" y1="36" x2="1064" y2="36"/><line x1="0" y1="116" x2="1064" y2="116"/><line x1="0" y1="196" x2="1064" y2="196"/><line x1="0" y1="276" x2="1064" y2="276"/><line x1="0" y1="356" x2="1064" y2="356"/></g>
      <line class="label-rule" x1="140" y1="36" x2="140" y2="356"/>
      <g class="actor" text-anchor="middle"><text x="70" y="80">ENGINE</text><text x="70" y="160">RUNOFF</text><text x="70" y="240">ROUTER</text><text x="70" y="312">DYN</text><text x="70" y="320">WAVE</text></g>
      <g text-anchor="middle">
        <rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text class="step-label" x="198" y="32">DT</text>
        <rect class="step-chip" x="302" y="8" width="16" height="16" rx="8"/><text class="step-num" x="310" y="19">2</text><text class="step-label" x="310" y="32">RUNOFF</text>
        <rect class="step-chip" x="414" y="8" width="16" height="16" rx="8"/><text class="step-num" x="422" y="19">3</text><text class="step-label" x="422" y="32">INFLOW</text>
        <rect class="step-chip" x="526" y="8" width="16" height="16" rx="8"/><text class="step-num" x="534" y="19">4</text><text class="step-label" x="534" y="32">GEOMETRY</text>
        <rect class="step-chip" x="638" y="8" width="16" height="16" rx="8"/><text class="step-num" x="646" y="19">5</text><text class="step-label" x="646" y="32">MOMENTUM</text>
        <rect class="step-chip" x="750" y="8" width="16" height="16" rx="8"/><text class="step-num" x="758" y="19">6</text><text class="step-label" x="758" y="32">DEPTHS</text>
        <rect x="862" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="870" y="19" fill="var(--accent)" font-size="7" font-weight="600" class="mono">7</text><text x="870" y="32" fill="var(--accent)" font-size="6" font-weight="500" letter-spacing=".12em" class="mono">CONVERGE?</text>
        <rect class="step-chip" x="974" y="8" width="16" height="16" rx="8"/><text class="step-num" x="982" y="19">8</text><text class="step-label" x="982" y="32">SNAPSHOT</text>
      </g>
      <!-- Connectors: right exit, r=8 orthogonal bend, top/bottom entry. -->
      <path class="connector" d="M248 76 H302 Q310 76 310 84 V124" marker-end="url(#arrow)"/>
      <path class="connector" d="M360 156 H414 Q422 156 422 148 V108" marker-end="url(#arrow)"/>
      <path class="connector" d="M360 76 H526 Q534 76 534 84 V204" marker-end="url(#arrow)"/>
      <path class="connector" d="M584 236 H638 Q646 236 646 244 V284" marker-end="url(#arrow)"/>
      <line class="connector" x1="696" y1="316" x2="708" y2="316" marker-end="url(#arrow)"/>
      <line class="connector focal" x1="808" y1="316" x2="820" y2="316" marker-end="url(#arrow-accent)"/>
      <path class="connector focal" d="M920 316 H974 Q982 316 982 308 V108" marker-end="url(#arrow-accent)"/>
      <path class="connector trigger" d="M920 340 H932 V376 H638 Q646 376 646 368 V348" marker-end="url(#arrow-sm)"/>
      <rect x="864" y="356" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text class="arrow-label" x="882" y="366" text-anchor="middle">RETRY</text>
      <!-- Nodes -->
      <g text-anchor="middle">
        <g><rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/><rect class="node" x="148" y="44" width="100" height="64" rx="6"/><rect class="role" x="152" y="48" width="20" height="10" rx="2"/><text class="role-text" x="162" y="56">ENG</text><text class="node-title" x="198" y="70">Compute dt</text><text class="node-sub" x="198" y="84">clock → dt</text><text class="node-tool" x="198" y="96">TimestepController</text></g>
        <g><rect class="node-mask" x="260" y="124" width="100" height="64" rx="6"/><rect class="node" x="260" y="124" width="100" height="64" rx="6"/><rect class="role" x="264" y="128" width="20" height="10" rx="2"/><text class="role-text" x="274" y="136">HYD</text><text class="node-title" x="310" y="150">Runoff + Infil</text><text class="node-sub" x="310" y="164">rain → runoff</text><text class="node-tool" x="310" y="176">RunoffSolver</text></g>
        <g><rect class="node-mask" x="372" y="44" width="100" height="64" rx="6"/><rect class="node" x="372" y="44" width="100" height="64" rx="6"/><rect class="role" x="376" y="48" width="20" height="10" rx="2"/><text class="role-text" x="386" y="56">ENG</text><text class="node-title" x="422" y="70">Assemble Inflow</text><text class="node-sub" x="422" y="84">runoff → lat_flow</text><text class="node-tool" x="422" y="96">inflow.computeAll</text></g>
        <g><rect class="node-mask" x="484" y="204" width="100" height="64" rx="6"/><rect class="node" x="484" y="204" width="100" height="64" rx="6"/><rect class="role" x="488" y="208" width="20" height="10" rx="2"/><text class="role-text" x="498" y="216">RTE</text><text class="node-title" x="534" y="230">Link Geometry</text><text class="node-sub" x="534" y="244">h → depth · area</text><text class="node-tool" x="534" y="256">XSectBatch</text></g>
        <g><rect class="node-mask" x="596" y="284" width="100" height="64" rx="6"/><rect class="node" x="596" y="284" width="100" height="64" rx="6"/><rect class="role" x="600" y="288" width="20" height="10" rx="2"/><text class="role-text" x="610" y="296">DYN</text><text class="node-title" x="646" y="310">Link Momentum</text><text class="node-sub" x="646" y="324">h → q · v</text><text class="node-tool" x="646" y="336">processManningLink</text></g>
        <g><rect class="node-mask" x="708" y="284" width="100" height="64" rx="6"/><rect class="node" x="708" y="284" width="100" height="64" rx="6"/><rect class="role" x="712" y="288" width="20" height="10" rx="2"/><text class="role-text" x="722" y="296">DYN</text><text class="node-title" x="758" y="310">Node Depths</text><text class="node-sub" x="758" y="324">q → h · vol</text><text class="node-tool" x="758" y="336">setNodeDepth</text></g>
        <g><rect class="node-mask" x="820" y="284" width="100" height="64" rx="6"/><rect class="node focal" x="820" y="284" width="100" height="64" rx="6"/><rect class="role focal" x="824" y="288" width="20" height="10" rx="2"/><text class="role-text focal" x="834" y="296">DYN</text><text class="node-title" x="870" y="310">Converged?</text><text class="node-sub" x="870" y="324">Δh ≤ 0.005 ft</text><text class="node-tool" x="870" y="336">max 8 trials</text></g>
        <g><rect class="node-mask" x="932" y="44" width="100" height="64" rx="6"/><rect class="node" x="932" y="44" width="100" height="64" rx="6"/><rect class="role" x="936" y="48" width="20" height="10" rx="2"/><text class="role-text" x="946" y="56">ENG</text><text class="node-title" x="982" y="70">Snapshot</text><text class="node-sub" x="982" y="84">state → .out · .rpt</text><text class="node-tool" x="982" y="96">postOutputSnapshot</text></g>
      </g>
      <!-- Legend -->
      <g>
        <text class="legend-key" x="144" y="412">STEPS</text>
        <g text-anchor="middle">
          <rect class="step-chip" x="200" y="404" width="16" height="16" rx="8"/><text class="step-num" x="208" y="415">1</text><text class="legend-text" x="240" y="415">DT</text>
          <rect class="step-chip" x="292" y="404" width="16" height="16" rx="8"/><text class="step-num" x="300" y="415">2</text><text class="legend-text" x="332" y="415">RUNOFF</text>
          <rect class="step-chip" x="384" y="404" width="16" height="16" rx="8"/><text class="step-num" x="392" y="415">3</text><text class="legend-text" x="424" y="415">INFLOW</text>
          <rect class="step-chip" x="476" y="404" width="16" height="16" rx="8"/><text class="step-num" x="484" y="415">4</text><text class="legend-text" x="516" y="415">GEOMETRY</text>
          <rect class="step-chip" x="568" y="404" width="16" height="16" rx="8"/><text class="step-num" x="576" y="415">5</text><text class="legend-text" x="608" y="415">MOMENTUM</text>
          <rect class="step-chip" x="660" y="404" width="16" height="16" rx="8"/><text class="step-num" x="668" y="415">6</text><text class="legend-text" x="700" y="415">DEPTHS</text>
          <rect x="752" y="404" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="760" y="415" fill="var(--accent)" font-size="7" font-weight="600" class="mono">7</text><text x="792" y="415" fill="var(--accent)" font-size="8">CONVERGE?</text>
          <rect class="step-chip" x="844" y="404" width="16" height="16" rx="8"/><text class="step-num" x="852" y="415">8</text><text class="legend-text" x="884" y="415">SNAPSHOT</text>
        </g>
        <text class="legend-key" x="144" y="436">FLOW</text>
        <line x1="200" y1="432" x2="228" y2="432" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="240" y="436">Critical handoff</text>
        <line x1="420" y1="432" x2="448" y2="432" stroke="var(--muted)" marker-end="url(#arrow)"/><text class="legend-text" x="460" y="436">Sequential handoff</text>
        <line x1="660" y1="432" x2="688" y2="432" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/><text class="legend-text" x="700" y="436">Retry loop</text>
      </g>
    </svg>
  </div>
</body>
</html>
