<!doctype html><meta charset="utf-8"><title>Worker module probe</title><pre id="s">start</pre><script>(async()=>{const s=document.getElementById('s');const b=await fetch('openswmm2d.wasm').then(r=>r.arrayBuffer());s.textContent=`loaded ${b.byteLength}`;const w=new Worker('probe-worker.js?v=4');w.onmessage=e=>{s.textContent+=`\n${JSON.stringify(e.data)}`;if(e.data.type==='import-ready')w.postMessage(b,[b]);if(e.data.type==='module-ready')document.title='PASS worker module probe'};w.onerror=e=>{s.textContent+=`\nerror ${e.message}`;document.title='FAIL worker module probe'}})();</script>
