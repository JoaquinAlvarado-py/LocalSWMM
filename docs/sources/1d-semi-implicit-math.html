<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriving the semi-implicit depth update</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,.08);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font: 500 .66rem var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif); letter-spacing: -.02em; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    svg text { font-family: var(--sans); }
    .mono { font-family: var(--mono); }
    .eq { fill: var(--ink); font: 9px var(--mono); }
    .sub { fill: var(--soft); font: 8px var(--mono); }
    .node-title { fill: var(--ink); font: 600 12px var(--sans); }
    .callout { fill: var(--ink); font: italic 14px var(--serif); }
    .callout-muted { fill: var(--muted); font: italic 14px var(--serif); }
    .legend-key { fill: var(--muted); font: 8px var(--mono); letter-spacing: .18em; }
    .legend-text { fill: var(--muted); font: 8.5px var(--sans); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Why the semi-implicit update is one equation</h1>

    <svg viewBox="0 0 1168 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="semi-implicit-math-title semi-implicit-math-desc">
      <title id="semi-implicit-math-title">Deriving the semi-implicit depth update</title>
      <desc id="semi-implicit-math-desc">Five-step derivation of the unified node depth update, from the continuity equation through trapezoidal integration and linearization of the outflow term to the closed-form solve.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="240" y1="192" x2="264" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="464" y1="192" x2="488" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="688" y1="192" x2="712" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="912" y1="192" x2="936" y2="192" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Callout leaders (dashed, drawn with arrows but before boxes) -->
      <path d="M 820 68 Q 700 96 596 152" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="588" cy="152" r="2" fill="#2d3142"/>
      <path d="M 140 232 V 284" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="140" cy="224" r="2" fill="#4f5d75"/>

      <!-- Step 1: continuity -->
      <rect x="40" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="140" y="184" text-anchor="middle">Continuity</text>
      <text class="eq" x="140" y="204" text-anchor="middle">A·dH/dt = Q_net(H)</text>
      <text class="sub" x="140" y="218" text-anchor="middle">storage = net inflow</text>

      <!-- Step 2: trapezoid -->
      <rect x="264" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="364" y="184" text-anchor="middle">Trapezoid rule</text>
      <text class="eq" x="364" y="204" text-anchor="middle">A·dH = 0.5·(Q_old + Q_new)·dt</text>
      <text class="sub" x="364" y="218" text-anchor="middle">integrate over dt</text>

      <!-- Step 3: linearize -->
      <rect x="488" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="588" y="184" text-anchor="middle">Linearize outflow</text>
      <text class="eq" x="588" y="204" text-anchor="middle">Q_new ≈ Q_net − Σdqdh·dH</text>
      <text class="sub" x="588" y="218" text-anchor="middle">∂Q_net/∂H = −Σdqdh</text>

      <!-- Step 4: substitute -->
      <rect x="712" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="812" y="184" text-anchor="middle">Substitute</text>
      <text class="eq" x="812" y="204" text-anchor="middle">(A + 0.5·Σdqdh·dt)·dH = dV</text>
      <text class="sub" x="812" y="218" text-anchor="middle">dV = 0.5·(Q_old + Q_net)·dt</text>

      <!-- Step 5: solve (focal) -->
      <rect x="936" y="160" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="node-title" x="1036" y="184" text-anchor="middle">Solve</text>
      <text class="eq" x="1036" y="204" fill="#eb6c36" text-anchor="middle">dH = dV / (A + 0.5·dt·Σdqdh)</text>
      <text class="sub" x="1036" y="218" text-anchor="middle">one equation · every regime</text>

      <!-- Editorial callouts -->
      <text class="callout" x="1160" y="56" text-anchor="end">Σdqdh is the equation's own damping —</text>
      <text class="callout" x="1160" y="74" text-anchor="end">a rising head drains more, so the update shrinks.</text>
      <text class="callout-muted" x="40" y="304">the trapezoid reuses the previous step's</text>
      <text class="callout-muted" x="40" y="322">net inflow — dV is Crank–Nicolson.</text>

      <!-- Legend -->
      <line x1="40" y1="344" x2="1128" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="legend-key" x="40" y="360">LEGEND</text>
      <rect x="112" y="352" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="legend-text" x="144" y="362">Derivation step</text>
      <line x1="300" y1="360" x2="328" y2="360" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text class="legend-text" x="336" y="362">New method</text>
      <path d="M 480 360 Q 528 360 556 360" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="legend-text" x="564" y="362">Editorial aside</text>
    </svg>
  </div>
</body>
</html>
