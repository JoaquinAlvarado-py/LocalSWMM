<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node continuity: explicit vs semi-implicit</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,.08);
      --rule: rgba(45,49,66,.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font: 500 .66rem var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif); letter-spacing: -.02em; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    svg text { font-family: var(--sans); }
    .mono { font-family: var(--mono); }
    .eq { fill: var(--ink); font: 9px var(--mono); }
    .note { fill: var(--soft); font: 8px var(--mono); }
    .node-title { fill: var(--ink); font: 600 12px var(--sans); }
    .diamond-text { fill: var(--ink); font: 600 11px var(--sans); }
    .arrow-label { fill: var(--muted); font: 8px var(--mono); letter-spacing: .12em; }
    .legend-key { fill: var(--muted); font: 8px var(--mono); letter-spacing: .18em; }
    .legend-text { fill: var(--muted); font: 8.5px var(--sans); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Node continuity — two depth-update formulations</h1>

    <svg viewBox="0 0 1120 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="node-continuity-title node-continuity-desc">
      <title id="node-continuity-title">Node continuity: explicit vs semi-implicit</title>
      <desc id="node-continuity-desc">Flowchart of the dynamic-wave node depth update: both formulations share the trapezoidal volume change, then semi-implicit uses one unified equation while the explicit path branches into free-surface and surcharged updates, before under-relaxation and state commit.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="184" x2="500" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="304" x2="500" y2="352" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="600" y1="260" x2="660" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="860" y1="260" x2="900" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="304" x2="760" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="416" x2="500" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 760 416 V 456 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 1000 296 V 480 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="512" x2="500" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px gap from their connector) -->
      <rect x="508" y="316" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="327" fill="#eb6c36" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="616" y="240" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="251" fill="#4f5d75" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <rect x="864" y="240" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="878" y="251" fill="#4f5d75" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="768" y="316" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="780" y="327" fill="#4f5d75" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <!-- Start oval -->
      <rect x="400" y="40" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Node continuity</text>

      <!-- Step: mass balance -->
      <rect x="400" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mass balance</text>
      <text class="eq" x="500" y="164" text-anchor="middle">dQ = Qin − Qout</text>
      <text class="eq" x="500" y="176" text-anchor="middle">dV = 0.5·(Qold + dQ)·dt</text>

      <!-- Diamond 1: semi-implicit? -->
      <polygon points="500,216 600,260 500,304 400,260" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="diamond-text" x="500" y="264" text-anchor="middle">SEMI-IMPLICIT?</text>

      <!-- Focal: semi-implicit unified update -->
      <rect x="400" y="352" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="node-title" x="500" y="376" text-anchor="middle">Semi-implicit</text>
      <text class="eq" x="500" y="396" fill="#eb6c36" text-anchor="middle">dy = dV / (A + 0.5·dt·Σdqdh)</text>

      <!-- Diamond 2: surcharged? (EXTRAN only) -->
      <polygon points="760,216 860,260 760,304 660,260" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="diamond-text" x="760" y="256" text-anchor="middle">EXTRAN</text>
      <text class="diamond-text" x="760" y="272" text-anchor="middle">SURCHARGED?</text>

      <!-- Step: surcharged dQ/dH -->
      <rect x="900" y="232" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="1000" y="256" text-anchor="middle">EXTRAN dQ/dH</text>
      <text class="eq" x="1000" y="276" text-anchor="middle">dy = corr·dQ / denom</text>
      <text class="note" x="1000" y="288" text-anchor="middle">crown blend exp(−15·f)</text>

      <!-- Step: free surface -->
      <rect x="660" y="352" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="760" y="376" text-anchor="middle">Free surface</text>
      <text class="eq" x="760" y="396" text-anchor="middle">dy = dV / A</text>

      <!-- Step: under-relaxation + ponding floor -->
      <rect x="400" y="448" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="500" y="472" text-anchor="middle">Under-relax · pond floor</text>
      <text class="eq" x="500" y="492" text-anchor="middle">y = (1−ω)·y_last + ω·y_new</text>
      <text class="note" x="500" y="504" text-anchor="middle">ω = 0.5 · FUDGE = 0.0001</text>

      <!-- Step: commit -->
      <rect x="400" y="536" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="node-title" x="500" y="560" text-anchor="middle">Commit state</text>
      <text class="eq" x="500" y="580" text-anchor="middle">overflow = dV/dt · y_max cap</text>
      <text class="eq" x="500" y="592" text-anchor="middle">head = invert + y · dYdT</text>

      <!-- Legend -->
      <line x1="40" y1="612" x2="1080" y2="612" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="legend-key" x="40" y="628">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="638" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="legend-text" x="72" y="648">Start / end (oval)</text>
      <rect x="220" y="638" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="legend-text" x="252" y="648">Step (rectangle)</text>
      <polygon points="412,644 424,638 436,644 424,650" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="legend-text" x="448" y="648">Decision (diamond)</text>
      <line x1="604" y1="646" x2="632" y2="646" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text class="legend-text" x="640" y="648">New method</text>
      <line x1="768" y1="646" x2="796" y2="646" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text class="legend-text" x="804" y="648">Branch</text>
    </svg>
  </div>
</body>
</html>
